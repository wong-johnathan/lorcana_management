services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lorcana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lorcana}
      POSTGRES_DB: lorcana_inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorcana -d lorcana_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: wongjohnathanwh741/lorcana-server:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lorcana:${POSTGRES_PASSWORD:-lorcana}@db:5432/lorcana_inventory
      JWT_SECRET: ${JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://minio.johnathanwwh.com}
      S3_BUCKET: ${S3_BUCKET:-lorcana-profile-images}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      REGISTER: ${REGISTER:-true}
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    command: sh -c "npx prisma migrate deploy && (npm run seed &) && npx tsx src/index.ts"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c '
      mc alias set lorcana-minio http://minio:9000 "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing lorcana-minio/${S3_BUCKET:-lorcana-profile-images} &&
      mc anonymous set download lorcana-minio/${S3_BUCKET:-lorcana-profile-images}
      '
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-lorcana-profile-images}

  nginx:
    image: wongjohnathanwh741/lorcana-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
  minio-data:
