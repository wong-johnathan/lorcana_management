services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lorcana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lorcana}
      POSTGRES_DB: lorcana_inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorcana -d lorcana_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr:
    image: wongjohnathanwh741/lorcana-ocr:latest
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  server:
    image: wongjohnathanwh741/lorcana-server:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lorcana:***@db:5432/lorcana_inventory
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      REGISTER: ${REGISTER:-true}
      PORT: "3001"
      OCR_SERVICE_URL: http://ocr:8000/v1/recognize/lorcana
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && (npm run seed &) && npx tsx src/index.ts"

  nginx:
    image: wongjohnathanwh741/lorcana-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
