[project]
name = "lorcana-ocr-service"
version = "0.1.0"
description = "Self-hosted OCR service for Lorcana card identification"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "pillow>=10,<12",
  "python-multipart>=0.0.20,<1",
  "rapidocr-onnxruntime==1.4.4",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
